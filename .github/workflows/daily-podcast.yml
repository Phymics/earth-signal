name: Daily Podcast

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  update-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts certifi

      - name: Generate podcast JSON and MP3
        run: python fetch_and_generate_podcast.py

      - name: Commit generated podcast files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today-podcast.json data/history-podcasts.json audio/today-podcast.mp3 audio/today-podcast-zh.mp3 audio/today-podcast-original.mp3 audio/history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated podcast changes to commit."
          else
            git commit -m "chore: update daily podcast"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send PushPlus notification
        if: ${{ success() && steps.commit.outputs.changed == 'true' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "PUSHPLUS_TOKEN is not set. Skip PushPlus notification."
            exit 0
          fi

          curl -fsS "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "token": os.environ["PUSHPLUS_TOKEN"],
              "title": "Earth Signal 今日播客已更新",
              "content": "今日播客已自动生成，可打开公网页面查看",
          }, ensure_ascii=False))
          PY
          )"
