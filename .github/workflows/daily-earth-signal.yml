name: Daily Earth Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  update-earth-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts certifi

      - name: Generate daily podcast
        run: python3 fetch_and_generate_podcast.py

      - name: Commit and push generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today-podcast.json data/history-podcasts.json audio/today-podcast.mp3 audio/today-podcast-zh.mp3 audio/today-podcast-original.mp3 audio/history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No podcast changes to commit."
          else
            git commit -m "chore: update daily Earth Signal podcast"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send PushPlus notification
        if: ${{ success() }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "PUSHPLUS_TOKEN is not set. Skip PushPlus notification."
            exit 0
          fi

          curl -fsS "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "token": os.environ["PUSHPLUS_TOKEN"],
              "title": "Earth Signal 今日播客已更新",
              "content": "今日播客已自动生成，可打开公网页面查看",
          }, ensure_ascii=False))
          PY
          )"
