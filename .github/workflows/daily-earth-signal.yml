name: Daily Earth Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  update-earth-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts certifi

      - name: Generate daily podcast
        run: python3 fetch_and_generate_podcast.py

      - name: Commit and push generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/today-podcast.json audio/today-podcast.mp3
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No podcast changes to commit."
          else
            git commit -m "chore: update daily Earth Signal podcast"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send ServerChan notification
        if: ${{ success() }}
        env:
          SERVER_CHAN_SEND_KEY: ${{ secrets.SERVER_CHAN_SEND_KEY }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$SERVER_CHAN_SEND_KEY" ]; then
            echo "SERVER_CHAN_SEND_KEY is not set. Skip ServerChan notification."
            exit 0
          fi

          curl -fsS "https://sctapi.ftqq.com/${SERVER_CHAN_SEND_KEY}.send" \
            --data-urlencode "title=Earth Signal 今日已更新" \
            --data-urlencode "desp=今日播客已自动生成。\n\nGitHub 仓库：${REPOSITORY_URL}"
