<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Signal | 地球信号</title>
  <style>
    :root {
      --bg: #030711;
      --bg-2: #071325;
      --card: rgba(11, 23, 44, 0.78);
      --card-strong: rgba(16, 34, 63, 0.92);
      --line: rgba(131, 219, 255, 0.22);
      --line-strong: rgba(120, 241, 255, 0.46);
      --text: #f5f8ff;
      --muted: #aab8d2;
      --blue: #3bd5ff;
      --blue-2: #78f1ff;
      --gold: #f3d48a;
      --gold-2: #fff0bb;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 50% -14%, rgba(59, 213, 255, 0.34), transparent 32%),
        radial-gradient(circle at 18% 16%, rgba(243, 212, 138, 0.15), transparent 25%),
        radial-gradient(circle at 84% 28%, rgba(42, 100, 196, 0.16), transparent 28%),
        linear-gradient(180deg, #01040d 0%, #061326 45%, #02040b 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.84) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(120, 241, 255, 0.6) 0 1px, transparent 1.2px),
        radial-gradient(circle, rgba(243, 212, 138, 0.52) 0 1px, transparent 1.1px);
      background-size: 84px 84px, 137px 137px, 213px 213px;
      background-position: 0 0, 32px 18px, 19px 64px;
      animation: stars 5.5s ease-in-out infinite alternate;
      opacity: 0.56;
    }

    body::after {
      background:
        linear-gradient(135deg, transparent 0 28%, rgba(59, 213, 255, 0.08), transparent 58% 100%),
        repeating-linear-gradient(180deg, transparent 0 13px, rgba(120, 241, 255, 0.025) 14px 15px);
      mix-blend-mode: screen;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 2px 2px 0;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gold-2);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .signal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 6px rgba(59, 213, 255, 0.12), 0 0 24px rgba(59, 213, 255, 0.9);
      animation: pulse 2.2s ease-in-out infinite;
    }

    .section {
      display: none;
      animation: rise 560ms ease both;
    }

    .section.active {
      display: block;
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 76px);
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 6px 0 8px;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      left: 50%;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .hero::before {
      top: 5%;
      width: min(96vw, 410px);
      height: min(96vw, 410px);
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 0 45%, rgba(120, 241, 255, 0.11) 46% 47%, transparent 48% 60%, rgba(243, 212, 138, 0.11) 61% 62%, transparent 63%),
        conic-gradient(from 115deg, transparent 0 21%, rgba(120, 241, 255, 0.2) 24%, transparent 28% 71%, rgba(243, 212, 138, 0.17) 74%, transparent 78%);
      filter: blur(0.2px);
      animation: signalSweep 9s linear infinite;
    }

    .hero::after {
      top: 19%;
      width: min(82vw, 340px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120, 241, 255, 0.6), transparent);
      box-shadow: 0 0 22px rgba(59, 213, 255, 0.44);
      animation: scanLine 4.6s ease-in-out infinite;
    }

    .earth-wrap {
      position: relative;
      width: min(76vw, 310px);
      aspect-ratio: 1;
      margin: 0 auto 2px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 24px 58px rgba(0, 0, 0, 0.42));
    }

    .orbit {
      position: absolute;
      inset: 6%;
      border: 1px solid rgba(120, 241, 255, 0.28);
      border-radius: 50%;
      transform: rotate(-18deg) scaleY(0.48);
      box-shadow: 0 0 36px rgba(59, 213, 255, 0.16), inset 0 0 30px rgba(59, 213, 255, 0.06);
      animation: orbitGlow 5s ease-in-out infinite alternate;
    }

    .orbit::after {
      content: "";
      position: absolute;
      right: 19%;
      top: 3%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 22px rgba(243, 212, 138, 0.9);
      animation: satellite 4.6s ease-in-out infinite;
    }

    .earth {
      position: relative;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.48), transparent 0 10%, transparent 11%),
        radial-gradient(circle at 36% 34%, rgba(103, 222, 255, 0.9), transparent 0 13%, transparent 14%),
        linear-gradient(120deg, rgba(59, 213, 255, 0.96), rgba(15, 79, 154, 0.9) 48%, rgba(2, 13, 34, 0.98));
      box-shadow:
        inset -38px -16px 48px rgba(0, 0, 0, 0.52),
        inset 18px 10px 34px rgba(255, 255, 255, 0.18),
        0 0 42px rgba(59, 213, 255, 0.42),
        0 0 92px rgba(59, 213, 255, 0.16);
    }

    .earth::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 24% 36%, rgba(20, 137, 111, 0.95) 0 13%, transparent 14%),
        radial-gradient(ellipse at 57% 28%, rgba(68, 166, 115, 0.9) 0 10%, transparent 11%),
        radial-gradient(ellipse at 64% 60%, rgba(72, 157, 102, 0.86) 0 16%, transparent 17%),
        radial-gradient(ellipse at 38% 69%, rgba(31, 126, 104, 0.86) 0 9%, transparent 10%);
      animation: rotateEarth 12s linear infinite;
    }

    .earth::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      background: radial-gradient(circle at 28% 26%, transparent 0 46%, rgba(0, 0, 0, 0.48) 78%);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .hero-copy {
      text-align: center;
      display: grid;
      gap: 9px;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: clamp(44px, 15vw, 66px);
      line-height: 0.95;
      letter-spacing: 0;
      text-shadow: 0 0 24px rgba(59, 213, 255, 0.36), 0 12px 40px rgba(0, 0, 0, 0.7);
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .entry-grid,
    .stack {
      display: grid;
      gap: 14px;
    }

    .card,
    .entry-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.06), transparent 36%),
        linear-gradient(145deg, rgba(12, 27, 52, 0.92), rgba(4, 10, 22, 0.82));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card::before,
    .entry-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.14), transparent 28% 72%, rgba(120, 241, 255, 0.07));
      opacity: 0.54;
    }

    .card > *,
    .entry-card > * {
      position: relative;
      z-index: 1;
    }

    .entry-card {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 14px;
      min-height: 118px;
      padding: 18px;
      text-align: left;
      color: var(--text);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .entry-card:hover,
    .entry-card:focus-visible,
    .primary:hover,
    .ghost:hover {
      transform: translateY(-2px);
      border-color: rgba(120, 241, 255, 0.65);
      box-shadow: 0 26px 76px rgba(0, 0, 0, 0.5), 0 0 34px rgba(59, 213, 255, 0.14);
    }

    .entry-icon,
    .capsule-icon,
    .podcast-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(243, 212, 138, 0.28);
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 240, 187, 0.2), transparent 42%),
        rgba(243, 212, 138, 0.08);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 18px rgba(243, 212, 138, 0.08);
    }

    .capsule-shape {
      width: 16px;
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold), var(--blue));
      box-shadow: 0 0 24px rgba(243, 212, 138, 0.45);
      transform: rotate(34deg);
      animation: capsuleFloat 3.4s ease-in-out infinite;
    }

    .podcast-shape {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      box-shadow: 0 0 0 7px rgba(59, 213, 255, 0.12), inset 0 0 16px rgba(59, 213, 255, 0.18);
      position: relative;
    }

    .podcast-shape::before,
    .podcast-shape::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
    }

    .podcast-shape::before {
      top: 7px;
      width: 9px;
      height: 14px;
      border-radius: 999px;
    }

    .podcast-shape::after {
      bottom: 5px;
      width: 16px;
      height: 2px;
      border-radius: 999px;
    }

    .entry-card h2 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .entry-card p,
    .muted {
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .footer-line {
      padding: 20px 8px 0;
      color: rgba(255, 240, 187, 0.78);
      text-align: center;
      font-size: 13px;
      text-shadow: 0 0 16px rgba(243, 212, 138, 0.18);
    }

    .page-head {
      display: grid;
      gap: 10px;
      margin: 6px 0 18px;
      padding: 6px 2px 0;
    }

    .page-head h1 {
      font-size: 30px;
      line-height: 1.12;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .card {
      padding: 18px;
    }

    .capsule-console {
      min-height: 178px;
      display: grid;
      align-content: end;
      border-color: rgba(243, 212, 138, 0.28);
      background:
        radial-gradient(circle at 50% 18%, rgba(243, 212, 138, 0.18), transparent 24%),
        radial-gradient(circle at 50% 38%, rgba(59, 213, 255, 0.13), transparent 28%),
        linear-gradient(145deg, rgba(12, 27, 52, 0.95), rgba(3, 8, 18, 0.9));
    }

    .capsule-console::after {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      width: 54px;
      height: 88px;
      border-radius: 999px;
      border: 1px solid rgba(255, 240, 187, 0.46);
      background:
        linear-gradient(180deg, rgba(255, 240, 187, 0.18), rgba(59, 213, 255, 0.2)),
        linear-gradient(90deg, transparent 0 45%, rgba(255, 255, 255, 0.26) 46% 49%, transparent 50%);
      box-shadow: 0 0 36px rgba(243, 212, 138, 0.18), inset 0 0 18px rgba(120, 241, 255, 0.14);
      transform: translateX(-50%) rotate(28deg);
      animation: capsuleRitual 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      font-size: 18px;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    input[type="date"] {
      width: 100%;
      color: var(--text);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(120, 241, 255, 0.34);
      border-radius: 14px;
      padding: 13px 14px;
      color-scheme: dark;
      box-shadow: inset 0 0 18px rgba(59, 213, 255, 0.06);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .primary,
    .ghost {
      min-height: 44px;
      border-radius: 14px;
      padding: 11px 15px;
      color: var(--text);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .primary {
      background: linear-gradient(135deg, #fff0bb 0%, #5ee8ff 45%, #1798d4 100%);
      color: #00131e;
      font-weight: 700;
      box-shadow: 0 12px 34px rgba(59, 213, 255, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.48);
    }

    .ghost {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .notice {
      display: none;
      margin-top: 12px;
      padding: 11px 13px;
      color: var(--gold-2);
      border: 1px solid rgba(243, 212, 138, 0.22);
      border-radius: 14px;
      background: rgba(243, 212, 138, 0.07);
      font-size: 13px;
      line-height: 1.55;
    }

    .notice.show {
      display: block;
    }

    .good-card,
    .news-card {
      display: grid;
      gap: 12px;
    }

    .good-card {
      border-color: rgba(243, 212, 138, 0.3);
      background:
        radial-gradient(circle at 88% 8%, rgba(243, 212, 138, 0.2), transparent 24%),
        linear-gradient(145deg, rgba(18, 35, 62, 0.95), rgba(4, 9, 18, 0.9));
    }

    .good-card::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(243, 212, 138, 0.34);
      background: radial-gradient(circle, rgba(243, 212, 138, 0.18), transparent 64%);
      box-shadow: 0 0 24px rgba(243, 212, 138, 0.12);
      pointer-events: none;
    }

    .news-card {
      min-height: 212px;
      padding-top: 24px;
      border-color: rgba(120, 241, 255, 0.32);
      background:
        radial-gradient(circle at 50% 18%, rgba(120, 241, 255, 0.16), transparent 30%),
        linear-gradient(145deg, rgba(13, 30, 58, 0.95), rgba(3, 7, 16, 0.92));
    }

    .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 999px;
      color: #02101a;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      font-size: 12px;
      font-weight: 700;
    }

    .good-card h2,
    .news-card h2 {
      font-size: 22px;
      line-height: 1.25;
    }

    .emotional {
      color: var(--gold-2);
      font-size: 15px;
      line-height: 1.7;
      border-left: 3px solid var(--gold);
      padding-left: 12px;
    }

    .archive-list,
    .history-list {
      display: grid;
      gap: 10px;
    }

    .mini-card {
      position: relative;
      min-height: 86px;
      padding: 15px 15px 15px 62px;
      border-radius: 16px;
      border: 1px solid rgba(243, 212, 138, 0.18);
      background:
        linear-gradient(90deg, rgba(243, 212, 138, 0.12), transparent 34%),
        rgba(255, 255, 255, 0.045);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .mini-card::before {
      content: attr(data-date);
      position: absolute;
      left: 12px;
      top: 13px;
      width: 38px;
      height: 56px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--gold-2);
      border: 1px solid rgba(243, 212, 138, 0.28);
      background: rgba(0, 0, 0, 0.24);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
    }

    .mini-card strong {
      display: block;
      margin-bottom: 5px;
      line-height: 1.4;
    }

    .empty {
      padding: 22px 14px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed rgba(120, 241, 255, 0.25);
      border-radius: 14px;
      line-height: 1.7;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: inset 0 0 32px rgba(59, 213, 255, 0.04);
    }

    .share-card {
      display: none;
      position: relative;
      overflow: hidden;
      min-height: 360px;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(243, 212, 138, 0.35);
      background:
        radial-gradient(circle at 82% 14%, rgba(243, 212, 138, 0.26), transparent 24%),
        radial-gradient(circle at 16% 76%, rgba(59, 213, 255, 0.22), transparent 26%),
        linear-gradient(145deg, #06152d, #020610 72%);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.52);
    }

    .share-card.show {
      display: grid;
      align-content: space-between;
      gap: 22px;
    }

    .share-date {
      color: var(--gold-2);
      font-size: 52px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    .share-card h2 {
      font-size: 24px;
      line-height: 1.22;
    }

    .share-card .planet-mark {
      position: absolute;
      right: -42px;
      bottom: -42px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 1px solid rgba(120, 241, 255, 0.28);
      background: radial-gradient(circle at 35% 30%, rgba(120, 241, 255, 0.46), rgba(11, 48, 91, 0.9) 52%, rgba(0, 0, 0, 0.72));
      opacity: 0.7;
    }

    .script-box {
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(120, 241, 255, 0.19);
      background: rgba(0, 0, 0, 0.28);
      color: #dce8ff;
      line-height: 1.82;
      white-space: pre-line;
      font-size: 14px;
    }

    .player {
      display: grid;
      gap: 14px;
      min-height: 214px;
      align-content: center;
      border-radius: 28px;
      border-color: rgba(120, 241, 255, 0.34);
      background:
        radial-gradient(circle at 50% 12%, rgba(120, 241, 255, 0.2), transparent 28%),
        radial-gradient(circle at 18% 72%, rgba(243, 212, 138, 0.12), transparent 28%),
        linear-gradient(180deg, rgba(14, 30, 57, 0.98), rgba(2, 5, 12, 0.96));
    }

    .player::after {
      content: "";
      width: 154px;
      height: 154px;
      position: absolute;
      right: -28px;
      top: 50%;
      border-radius: 50%;
      border: 1px solid rgba(120, 241, 255, 0.18);
      background:
        radial-gradient(circle, rgba(59, 213, 255, 0.18) 0 12%, transparent 13% 25%, rgba(255, 255, 255, 0.05) 26% 27%, transparent 28% 45%, rgba(120, 241, 255, 0.1) 46% 47%, transparent 48%),
        rgba(0, 0, 0, 0.14);
      opacity: 0.68;
      transform: translateY(-50%);
      pointer-events: none;
      animation: vinylTurn 10s linear infinite;
    }

    .status-pill {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      color: var(--blue-2);
      border-radius: 999px;
      border: 1px solid rgba(120, 241, 255, 0.22);
      background: rgba(59, 213, 255, 0.08);
      font-size: 13px;
      position: relative;
      z-index: 1;
    }

    .status-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 16px currentColor;
    }

    .history-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 72px;
      padding: 13px;
      text-align: left;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.045);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .history-item:hover {
      transform: translateY(-1px);
      border-color: rgba(120, 241, 255, 0.34);
      background: rgba(120, 241, 255, 0.065);
    }

    .flow {
      display: grid;
      gap: 10px;
    }

    .flow-step {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
    }

    .flow-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #02101a;
      background: var(--blue-2);
      font-weight: 800;
      box-shadow: 0 0 22px rgba(59, 213, 255, 0.18);
    }

    .flow-text {
      padding: 12px 13px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
    }

    }

      }
    }

      return `${parts[1]}-${parts[2]}`;

      if (!value) return "05-26";
      const parts = value.split("-");
      return `${parts[1]}.${parts[2]}`;
    }

      return goodNewsData[Math.floor(Math.random() * goodNewsData.length)];

      const fallback = !forceRandom && !matched;
      state.currentGoodNews = item;
      renderGoodNews(item, fallback);
    }

            <strong>${item.date} · ${item.title}</strong>
            <span class="muted">${item.category}</span>
          </span>
          <span class="muted">${item.duration}</span>
        </button>
      `).join("");
      historyList.querySelectorAll("button").forEach((button, index) => {
        button.addEventListener("click", () => {
          renderPodcast(podcastData[index]);
          todayNews.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }

    function renderFlow() {
      flowList.innerHTML = flowSteps.map((step, index) => `
        <div class="flow-step">
          <span class="flow-num">${index + 1}</span>
          <span class="flow-text">${step}</span>
        </div>
      `).join("");
    }

    function playSpeech() {
      if (!("speechSynthesis" in window)) {
        playStatus.textContent = "当前浏览器不支持朗读";
        return;
      }
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        playStatus.textContent = "播放中";
        state.speaking = true;
        return;
      }
      stopSpeech(false);
      const utterance = new SpeechSynthesisUtterance(state.currentPodcast.script);
      utterance.lang = "zh-CN";
      utterance.rate = 0.95;
      utterance.pitch = 0.95;
      utterance.onend = () => {
        playStatus.textContent = "已暂停";
        state.speaking = false;
      };
      state.utterance = utterance;
      state.speaking = true;
      playStatus.textContent = "播放中";
      window.speechSynthesis.speak(utterance);
    }

    function pauseSpeech() {
      if ("speechSynthesis" in window && window.speechSynthesis.speaking) {
        window.speechSynthesis.pause();
      }
      state.speaking = false;
      playStatus.textContent = "已暂停";
    }

    function stopSpeech(updateStatus = true) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      state.speaking = false;
      if (updateStatus) playStatus.textContent = "已暂停";
    }

    document.querySelectorAll("[data-route]").forEach((button) => {
      button.addEventListener("click", () => showSection(button.dataset.route));
    });

    openCapsuleBtn.addEventListener("click", () => openCapsule(false));
    playBtn.addEventListener("click", playSpeech);
    pauseBtn.addEventListener("click", pauseSpeech);

    const today = new Date();
    dateInput.value = today.toISOString().slice(0, 10);
    backBtn.style.visibility = "hidden";
    renderArchive();
    renderPodcast(podcastData[0]);
    renderHistory();
    renderFlow();
  </script>
</body>
</html>
